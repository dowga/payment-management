<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <title>Управление платежами</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1, h2, h3 {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        form {
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 7px;
            margin: 4px 0;
        }

        .create-form {
            max-width: 500px;
        }

        .status {
            font-weight: bold;
        }

        .status-created {
        color: #1565c0;
        font-weight: bold;
        }

        .status-executed {
        color: #2e7d32;
        font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Управление платежами</h1>

<hr>

<h2>Новый платёж</h2>

<form class="create-form"
      th:action="@{/payments}"
      th:object="${payment}"
      method="post">

    <div>
        <label>Сумма:</label><br>
        <input type="number"
               th:field="*{amount}"
               min="0.01"
               step="0.01"
               required>
    </div>

    <div>
        <label>Валюта:</label><br>
        <select th:field="*{currency}" required>
            <option value="">Выберите валюту</option>
            <option th:each="currency : ${currencies}"
                    th:value="${currency}"
                    th:text="${currency}">
            </option>
        </select>
    </div>

    <div>
        <label>Получатель:</label><br>
        <input type="text" th:field="*{recipient}" required>
    </div>

    <div>
        <label>ИНН:</label><br>
        <input type="text" th:field="*{inn}" required>
    </div>

    <div>
        <label>Назначение:</label><br>
        <input type="text" th:field="*{purpose}" required>
    </div>

    <div>
        <label>Описание:</label><br>
        <textarea th:field="*{description}"
                  rows="3"
                  cols="40"></textarea>
    </div>

    <br>

    <button type="submit">Создать платёж</button>
</form>

<hr>

<h3>Поиск платежа по ID</h3>

<form action="/payment" method="get">
    <input type="number" name="id" placeholder="ID платежа" min="1" required>
    <button type="submit">Найти</button>
</form>

<hr>

<h3>Фильтры</h3>

<form action="/" method="get">

    <label>Статус:</label>

    <select name="status">
        <option value="">Все</option>

        <option value="created"
                th:selected="${param.status != null and param.status[0] == 'created'}">
            CREATED
        </option>

        <option value="executed"
                th:selected="${param.status != null and param.status[0] == 'executed'}">
            EXECUTED
        </option>
    </select>

    <label>Валюта:</label>

    <select name="currency">
        <option value="">Все</option>

        <option th:each="c : ${currencies}"
                th:value="${c}"
                th:text="${c}"
                th:selected="${param.currency != null and param.currency[0] == c.name()}">
        </option>
    </select>

    <button type="submit">Применить</button>

    <a href="/">Сбросить</a>

</form>

<hr>

<h2>Все платежи</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Сумма</th>
        <th>Валюта</th>
        <th>Получатель</th>
        <th>ИНН</th>
        <th>Назначение</th>
        <th>Статус</th>
        <th>Описание</th>
        <th>Дата создания</th>
        <th>Дата исполнения</th>
        <th>Действие</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="p : ${payments}">
        <td th:text="${p.id}">1</td>
        <td th:text="${p.amount}">1000.00</td>
        <td th:text="${p.currency}">RUB</td>
        <td th:text="${p.recipient}">ООО Ромашка</td>
        <td th:text="${p.inn}">1234567890</td>
        <td th:text="${p.purpose}">Оплата</td>
        <td th:class="${p.status == 'created' ? 'status-created' : 'status-executed'}"
            th:text="${p.status}">
            created
        </td>
        <td th:text="${p.description}">Описание</td>
        <td th:text="${p.createdAt}">2026-08-27</td>
        <td th:text="${p.executionDate}">2026-08-30</td>
        <td>

            <form th:if="${p.status == 'created'}"
                  th:action="@{/execute/{id}(id=${p.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        onclick="return confirm('Выполнить платёж?');">
                    Выполнить
                </button>

            </form>

            <form th:action="@{/delete/{id}(id=${p.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        onclick="return confirm('Удалить платёж?');">
                    Удалить
                </button>

            </form>

        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
